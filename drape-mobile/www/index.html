<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#231733">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drape — your 3D wardrobe</title>
<style>
:root{
  --bg:#F6F3F9;--sf:#FFFFFF;--sf2:#F1ECF7;--ink:#231733;--mut:#6B5F7E;--line:#E2DAEC;
  --ac:#D6336C;--act:#FFFFFF;--ac2:#0F8A7F;--bad:#C0392B;--ok:#0F8A5F;
  --st1:#FFFFFF;--st2:#EADFF4;
  --disp:'Syne',system-ui,-apple-system,'Segoe UI',sans-serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#150F20;--sf:#1F1730;--sf2:#281E3D;--ink:#F1EBFA;--mut:#A99CC0;--line:#382B52;--ac:#FF6FA1;--act:#2A0B18;--ac2:#3CCBBE;--bad:#FF8A7A;--ok:#5FDDA6;--st1:#2B2040;--st2:#1A1228}
}
:root[data-theme="dark"]{--bg:#150F20;--sf:#1F1730;--sf2:#281E3D;--ink:#F1EBFA;--mut:#A99CC0;--line:#382B52;--ac:#FF6FA1;--act:#2A0B18;--ac2:#3CCBBE;--bad:#FF8A7A;--ok:#5FDDA6;--st1:#2B2040;--st2:#1A1228}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.mut{color:var(--mut)}.sm{font-size:13px}.err{color:var(--bad);font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 40px}
header{display:flex;align-items:baseline;gap:12px;padding:16px 0 10px;flex-wrap:wrap}
.logo{font:800 34px/1 var(--disp);letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--ac)}
.tag{color:var(--mut);font-size:14px}
.layout{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.layout{grid-template-columns:minmax(340px,430px) 1fr;align-items:start}.stage{position:sticky;top:12px}}
.stage{background:radial-gradient(120% 90% at 50% 25%,var(--st1),var(--st2));border:1px solid var(--line);border-radius:22px;overflow:hidden}
#gl{width:100%;height:min(62vh,560px);min-height:360px;touch-action:none;cursor:grab}
#gl canvas{display:block;width:100%;height:100%}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--sf);font-size:12px;color:var(--mut);flex-wrap:wrap}
.nogl{padding:40px 20px;text-align:center;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--sf);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:700;font-size:14px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,.sw:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{font:700 18px var(--disp);margin:0 0 6px;letter-spacing:-.01em}
.card p{margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn.p{background:var(--ac);color:var(--act);border-color:var(--ac)}
.btn.s{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.d{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sf2);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;flex:none}
.sw.sel{border-color:var(--ink)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}
.fld{margin:12px 0}
.fld label{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:4px}
.fld label span{color:var(--mut);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=color]{width:42px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--sf);padding:2px;cursor:pointer}
input[type=text]{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:8px 10px;min-width:0}
select{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
.slot{border:1px dashed var(--line);border-radius:14px;padding:10px;background:var(--sf2);min-width:0;flex:1 1 200px}
.slot img{width:84px;height:108px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs div{position:relative}
.thumbs img{width:76px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:13px;line-height:1}
.note{background:var(--sf2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut);margin:8px 0}
.spin{display:flex;align-items:center;gap:10px;padding:10px 0;color:var(--mut);flex-wrap:wrap}
.spin i{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin i{animation-duration:2.4s}}
.score{font:800 38px/1 var(--disp);color:var(--ac)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac2)}
ul.cl{margin:6px 0 0;padding-left:18px}
ul.cl li{margin:2px 0}
.big{font:800 54px/1 var(--disp);letter-spacing:-.04em}
.cat{border-top:1px solid var(--line);padding:10px 0}
.cat:first-child{border-top:0}
.it{display:flex;align-items:center;gap:8px;padding:5px 0}
.it .nm{flex:1;min-width:0}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--sf2);cursor:pointer;font-weight:800}
.step b{min-width:24px;text-align:center}
.pc{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.pc:first-child{border-top:0}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;cursor:pointer;background:var(--sf2)}
#saveSt{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sf);border:1px solid var(--line);color:var(--mut);margin-bottom:8px}
.lmbox{max-width:360px;margin:8px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;touch-action:none}
.lmbox svg{display:block;width:100%;height:auto;touch-action:none}
.fgrid{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
#fprev{width:120px;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--sf2)}
.lk{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lk:first-child{border-top:0}
.lk input{flex:1;min-width:110px}
.toastx{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:min(92vw,440px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toastx.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toastx{transition:none}}
.ov{position:fixed;inset:0;background:rgba(10,6,20,.6);display:grid;place-items:center;padding:16px;z-index:80;overflow:auto}
.md{background:var(--sf);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:18px}
.md h3{font:800 20px var(--disp);margin:0 0 8px}
a.btn{text-decoration:none;color:inherit}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
input[type=time]{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:8px 10px}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">Drape<i>.</i></div><div class="tag">A 3D you, fitted from your own photo. Try dresses, count your closet, get a look daily.</div></header>
  <div class="layout">
    <section class="stage" aria-label="3D model of you">
      <div id="gl"></div>
      <div class="stagebar"><span>Drag to turn · scroll or pinch to zoom</span>
        <span class="row" style="gap:10px"><button class="btn s" id="viewBtn" type="button">👤 Face view</button><label class="row" style="gap:6px"><input type="checkbox" id="auto" checked> Auto-rotate</label></span></div>
    </section>
    <section>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div id="saveSt">Loading…</div>
      <div id="aiNote"></div>
      <div id="panel"></div>
    </section>
  </div>
</div>
<div class="toastx" id="toastx" role="status" aria-live="polite"></div>
<div id="rmodal" class="ov" hidden></div>

<script src="three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HEX=/^#[0-9a-fA-F]{6}$/;
const hex=(v,d)=>typeof v==='string'&&HEX.test(v.trim())?v.trim():d;
const num=(v,a,b,d)=>{v=Number(v);return Number.isFinite(v)?clamp(v,a,b):d};
const oneOf=(v,l,d)=>l.includes(v)?v:d;
const D=Math.PI/180;
const KEY='drape-v2';
function toast(t){const e=$('toastx');e.textContent=t;e.className='toastx show';clearTimeout(toast.t);toast.t=setTimeout(()=>{e.className='toastx'},2600)}

/* ---------------- state ---------------- */
const STYLES={
  aline:{n:'A-line',mode:'flare',k:.26,fold:.035,d:'Fitted top, skirt flares gently from the waist'},
  bodycon:{n:'Bodycon',mode:'fit',k:-.06,fold:0,d:'Follows the body closely'},
  flowy:{n:'Flowy',mode:'flare',k:.34,fold:.08,d:'Soft, loose and flowing'},
  ball:{n:'Ball gown',mode:'flare',k:.55,fold:.06,d:'Full, dramatic skirt'},
  slip:{n:'Slip / cocktail',mode:'fit',k:.10,fold:.02,d:'Light, straight, slightly loose'},
  empire:{n:'Empire waist',mode:'flare',k:.30,fold:.05,d:'Seam just under the bust, skirt falls from there',empire:1}
};
const NECK=['round','v','strapless','halter'];
const SLEEVES=['none','short','long'];
const TOPS=['tee','longsleeve','tank'];
const BOTTOMS=['jeans','skirt','shorts'];
const DLM={ch:.87,sh:.82,bu:.72,wa:.63,hi:.52,cr:.46};
const OCC=['Casual day','Work / college','Formal event','Party / date night','Wedding / festival','Gym / active','Travel'];
const WEA=['Hot','Warm','Mild','Cool','Rainy','Cold'];
const MOOD=['Comfortable','Confident','Playful','Elegant'];
const defaults=()=>({
  ts:0,
  me:{h:165,bust:90,waist:72,hip:96,sh:38,skin:'#D9A67E',hair:'#2B1B14',hairLen:'long',lm:Object.assign({},DLM),face:null,fitted:false,profile:null},
  outfit:{mode:'dress',dress:{style:'aline',length:.6,neckline:'round',sleeves:'none',color:'#D6336C'},top:{type:'tee',color:'#FFFFFF'},bottom:{type:'jeans',color:'#3B5A99',length:.5},shoes:'#222222'},
  closet:{items:[],scans:0},hist:[],looks:[],dsel:{occ:OCC[0],wea:WEA[1],mood:MOOD[1]},
  cfg:{key:'',model:'claude-sonnet-5-5',server:'',token:''},loc:{mode:'off',lat:null,lon:null,city:'',wx:null},rem:{on:false,time:'08:00'}
});
function normOutfit(o){
  const d=defaults().outfit;o=o||{};const dr=o.dress||{},tp=o.top||{},bt=o.bottom||{};
  return{mode:oneOf(o.mode,['dress','separates'],d.mode),
    dress:{style:oneOf(dr.style,Object.keys(STYLES),d.dress.style),length:num(dr.length,0,1,d.dress.length),neckline:oneOf(dr.neckline,NECK,d.dress.neckline),sleeves:oneOf(dr.sleeves,SLEEVES,d.dress.sleeves),color:hex(dr.color,d.dress.color)},
    top:{type:oneOf(tp.type,TOPS,d.top.type),color:hex(tp.color,d.top.color)},
    bottom:{type:oneOf(bt.type,BOTTOMS,d.bottom.type),color:hex(bt.color,d.bottom.color),length:num(bt.length,0,1,d.bottom.length)},
    shoes:hex(o.shoes,d.shoes)};
}
function mergeState(o){
  const d=defaults();o=o||{};
  const n=Object.assign(d,o);
  n.me=Object.assign(defaults().me,o.me||{});n.me.lm=Object.assign({},DLM,(o.me&&o.me.lm)||{});
  n.outfit=normOutfit(o.outfit);n.dsel=Object.assign(defaults().dsel,o.dsel||{});
  n.cfg=Object.assign(defaults().cfg,o.cfg||{});n.loc=Object.assign(defaults().loc,o.loc||{});n.rem=Object.assign(defaults().rem,o.rem||{});
  n.closet=Object.assign({items:[],scans:0},o.closet||{});n.hist=Array.isArray(o.hist)?o.hist:[];n.looks=Array.isArray(o.looks)?o.looks:[];
  return n;
}
let ST=defaults();
try{const t=localStorage.getItem(KEY);if(t)ST=mergeState(JSON.parse(t))}catch(e){}
let tab='me',BUSY=null,RES={},PH={body:[],face:[],closet:[]},LM=null,META=null,FACE=null;

/* ---------------- persistence: account (db) + this device ---------------- */
let DB=null,UID=null,dbT=0,locT=0,SAVEMODE='local';
function setSave(m){SAVEMODE=m;const e=$('saveSt');if(!e)return;e.textContent={saving:'Saving…',cloud:'☁️ Saved to your account',local:'💾 Saved on this device',localerr:'💾 Saved on this device (account sync failed)'}[m]||''}
function save(){
  clearTimeout(locT);locT=setTimeout(()=>{ST.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}
    if(DB){setSave('saving');clearTimeout(dbT);dbT=setTimeout(dbWrite,1200)}else setSave('local')},300);
}
const plain=o=>JSON.parse(JSON.stringify(o));
async function dbWrite(){
  if(!DB||!UID)return;
  try{
    const base='data/users/'+UID+'/';
    const a={ts:ST.ts,me:ST.me,outfit:ST.outfit,dsel:ST.dsel};
    if(JSON.stringify(a).length>230000)a.me=Object.assign({},ST.me,{face:null});
    const b={ts:ST.ts,closet:ST.closet,hist:ST.hist,looks:ST.looks};
    await Promise.all([DB.doc(base+'drape').set(plain(a)),DB.doc(base+'drape2').set(plain(b))]);
    setSave('cloud');
  }catch(e){setSave('localerr')}
}
async function initStore(){
  try{
    const u=await window.claude.use('user'),db=await window.claude.use('db');
    if(u&&db){const id=await u.id();
      if(id){UID=id;DB=db;const base='data/users/'+id+'/';
        const [a,b]=await Promise.all([DB.doc(base+'drape').get(),DB.doc(base+'drape2').get()]);
        const ad=a.exists?a.data():null,bd=b.exists?b.data():null;
        const ts=Math.max(ad&&ad.ts||0,bd&&bd.ts||0);
        if(ts>(ST.ts||0)){
          if(ad&&ad.reset)ST=defaults();
          else ST=mergeState({me:ad&&ad.me,outfit:ad&&ad.outfit,dsel:ad&&ad.dsel,closet:bd&&bd.closet,hist:bd&&bd.hist,looks:bd&&bd.looks});
          ST.ts=ts;try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}
          loadFace();rebuild();renderAll();
        }else if(ST.ts)dbWrite();
        setSave('cloud');return;
      }}
  }catch(e){}
  setSave('local');
}

/* ---------------- AI (Claude via sample) ---------------- */
let SAMPLE=null,IMGOK=false,ctl=null;
async function initAI(){
  try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use('sample');if(SAMPLE){ENGINE='claude';try{IMGOK=!!(await SAMPLE.limits()).images}catch(e){}}}}catch(e){SAMPLE=null}
  if(!SAMPLE){SAMPLE=makeKeySample();IMGOK=true;ENGINE='key'}
  renderAll();
}
async function ask(prompt,imgs){
  if(!SAMPLE)throw{code:'unavailable'};
  ctl=new AbortController();const o={signal:ctl.signal,modelTier:'default'};
  if(imgs&&imgs.length)o.images=imgs;
  return await SAMPLE.json(prompt,o);
}
function errMsg(e){
  if(ctl&&ctl.signal.aborted)return 'Stopped.';
  const c=e&&e.code;
  return {no_key:'Add your Claude API key in Settings first.',bad_key:'Your API key was rejected. Check it in Settings.',rate_limited:'Too many requests. Wait a moment, then try again.',busy:'The AI service is busy. Try again shortly.',network:'No connection. Check your internet and try again.',parse:'The AI reply could not be read. Try again.',not_granted:'Permission was declined.',images_unavailable:'Photo reading is not available.',unavailable:'AI is not available here.'}[c]||'Something went wrong. Please try again.';
}
async function run(key,fn){
  if(BUSY)return;BUSY=key;renderPanel();
  try{RES[key]=await fn()}catch(e){RES[key]={error:errMsg(e)}}
  BUSY=null;renderPanel();
}
const spin=txt=>`<div class="spin"><i></i><span>${txt} This can take up to a minute.</span><button class="btn s" data-a="stop">Stop</button></div>`;

/* ---------------- photos ---------------- */
async function prep(file){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(file)}
  const s=Math.min(1,1024/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
  const mk=m=>{const k=Math.min(1,m/Math.max(c.width,c.height)),t=document.createElement('canvas');t.width=Math.round(c.width*k);t.height=Math.round(c.height*k);t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.78)};
  return{blob,thumb:mk(150),view:mk(720),canvas:c,w:c.width,h:c.height};
}
async function addPhotos(kind,files){
  const max=kind==='closet'?4:1;
  for(const f of files){
    try{const p=await prep(f);
      if(kind==='closet'){if(PH.closet.length<max)PH.closet.push(p)}
      else{PH[kind]=[p];if(kind==='body'){LM=null;META=null}}
    }catch(e){}
  }
  renderPanel();
}

/* ---------------- 3D ---------------- */
let renderer=null,scene,camera,root,keyLight,figure=null,rotY=.5,zoom=1,dragging=false,lastX=0,pinch=0,need=true,viewFace=false,FT={tex:null},fabric=null;
function fabricTex(){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const id=x.createImageData(64,64);
  for(let i=0;i<64*64;i++){const r=(i/64)|0,q=i%64;const v=128+(((r+q)%2)?18:-18)+(Math.random()*26-13);id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255}
  x.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(14,14);return t;
}
function initGL(){
  const el=$('gl');
  try{
    if(!window.THREE)throw 0;
    renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    el.appendChild(renderer.domElement);
  }catch(e){renderer=null;el.innerHTML='<div class="nogl">3D view is not available on this device. The rest of the app still works.</div>';return}
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(35,1,1,4000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x9a90b4,.8));
  keyLight=new THREE.DirectionalLight(0xffffff,.95);keyLight.castShadow=true;keyLight.shadow.mapSize.set(1024,1024);keyLight.shadow.bias=-.0004;
  scene.add(keyLight);scene.add(keyLight.target);
  const rim=new THREE.DirectionalLight(0xffd6e7,.35);rim.position.set(-200,120,-200);scene.add(rim);
  root=new THREE.Group();scene.add(root);
  fabric=fabricTex();
  new ResizeObserver(resize).observe(el);resize();
  el.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;el.setPointerCapture(e.pointerId);$('auto').checked=false});
  el.addEventListener('pointermove',e=>{if(!dragging)return;rotY+=(e.clientX-lastX)*.01;lastX=e.clientX;need=true});
  el.addEventListener('pointerup',()=>{dragging=false});el.addEventListener('pointercancel',()=>{dragging=false});
  el.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY>0?1.06:.94),.5,1.6);need=true},{passive:false});
  el.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom=clamp(zoom*(pinch/d),.5,1.6);pinch=d;need=true}},{passive:true});
  el.addEventListener('touchend',()=>{pinch=0});
  $('viewBtn').addEventListener('click',()=>{viewFace=!viewFace;zoom=1;$('viewBtn').textContent=viewFace?'🧍 Full body':'👤 Face view';need=true});
  rebuild();
  (function loop(){requestAnimationFrame(loop);
    if($('auto').checked&&!dragging){rotY+=.006;need=true}
    if(need&&renderer){
      root.rotation.y=rotY;const H=ST.me.h,L=ST.me.lm||DLM;
      if(viewFace){const hy=H*(L.ch+(1-L.ch)/2);camera.position.set(0,hy,H*.62*zoom);camera.lookAt(0,hy,0)}
      else{camera.position.set(0,H*.52,H*1.9*zoom);camera.lookAt(0,H*.48,0)}
      renderer.render(scene,camera);need=false}
  })();
}
function resize(){if(!renderer)return;const el=$('gl'),w=el.clientWidth||300,h=el.clientHeight||400;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();need=true}
let rbT=0;function rebuildSoon(){if(rbT)return;rbT=requestAnimationFrame(()=>{rbT=0;rebuild()})}
function rebuild(){

  const H=ST.me.h;
  keyLight.position.set(H*.7,H*1.6,H*1.8);keyLight.target.position.set(0,H*.5,0);
  const sc=keyLight.shadow.camera;sc.left=-H*.9;sc.right=H*.9;sc.top=H*1.3;sc.bottom=-H*.4;sc.near=H*.5;sc.far=H*5;sc.updateProjectionMatrix();

}

function buildFigure(me,out,faceTex){
  const H=me.h,s=H/170,g=new THREE.Group(),res=[];
  const L=Object.assign({},DLM,me.lm||{});
  const M=(c,o)=>{const m=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.62,metalness:.02},o||{}));res.push(m);return m};
  const mesh=(geo,mat,noShadow)=>{res.push(geo);const m=new THREE.Mesh(geo,mat);if(!noShadow)m.castShadow=true;return m};
  const Y=f=>f*H;
  const skin=M(me.skin,{roughness:.58,emissive:new THREE.Color(me.skin).multiplyScalar(.1)}),hairM=M(me.hair,{roughness:.5});
  const rB=me.bust/6.28*1.1,rW=me.waist/6.28*1.1,rH=me.hip/6.28*1.1,rS=me.sh/2,rN=4.6*s;
  const tp=[[L.cr,rH*.86],[L.hi,rH],[L.wa,rW],[L.bu,rB],[L.sh-.02,Math.max(rS*.9,rB*.9)],[(L.sh+L.ch)/2+.005,rN*1.15],[L.ch,rN]];
  const bodyR=f=>{if(f<=tp[0][0])return tp[0][1];for(let i=1;i<tp.length;i++){if(f<=tp[i][0]){const a=tp[i-1],b=tp[i],t=(f-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t}}return rN};
  const kn=L.cr*.587;
  const legR=f=>f>=L.cr?rH*.5:f>=kn?rH*.5+(rH*.34-rH*.5)*((L.cr-f)/(L.cr-kn)):rH*.34+(3.3*s-rH*.34)*((kn-f)/(kn-.045));
  const xL=rH*.42;
  const lathe=(pts,mat,zs)=>{const m=mesh(new THREE.LatheGeometry(pts,56),mat);m.scale.z=zs||.76;return m};

  /* body */
  {const pts=tp.map(([f,r])=>new THREE.Vector2(r,Y(f)));const sp=new THREE.SplineCurve(pts).getPoints(56).map(p=>new THREE.Vector2(Math.max(.2,p.x),p.y));
   g.add(lathe(sp,skin,.74));}
  [-1,1].forEach(sd=>{
    const pts=[];for(let f=.04;f<=L.cr+.03;f+=.02)pts.push(new THREE.Vector2(legR(f),Y(f)));
    const l=lathe(pts,skin,.9);l.position.x=sd*xL;g.add(l);
    const sh=mesh(new THREE.SphereGeometry(4.2*s,18,12),M(out.shoes,{roughness:.45}));sh.scale.set(1,.6,2.3);sh.position.set(sd*xL,Y(.03),4.2*s);g.add(sh)});
  const neck=mesh(new THREE.CylinderGeometry(rN*.92,rN,Y(L.ch-L.sh+.04),22),skin);neck.position.y=Y((L.sh+L.ch)/2);g.add(neck);

  /* head */
  const rVert=Y(1-L.ch)/2,R=rVert/1.17,cy=Y(L.ch)+rVert;
  const head=mesh(new THREE.SphereGeometry(R,40,30),skin);head.scale.set(.95,1.17,1);head.position.y=cy;g.add(head);
  if(faceTex){
    const fg=new THREE.SphereGeometry(R*1.012,56,40,Math.PI/2-1.0,2.0,Math.PI*.2,Math.PI*.66);
    const pos=fg.attributes.position,uv=fg.attributes.uv;
    for(let i=0;i<pos.count;i++){uv.setXY(i,.5+pos.getX(i)/(1.68*R),.5+pos.getY(i)/(2*R))}
    uv.needsUpdate=true;
    const fm=new THREE.MeshStandardMaterial({map:faceTex,emissiveMap:faceTex,emissive:new THREE.Color(0xffffff),emissiveIntensity:.45,roughness:.6,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
    res.push(fm);const fmesh=mesh(fg,fm,true);fmesh.scale.set(.95,1.17,1);fmesh.position.y=cy;g.add(fmesh);
  }else{
    [-1,1].forEach(sd=>{const e=mesh(new THREE.SphereGeometry(R*.07,10,8),M('#2a2230'));e.position.set(sd*R*.34,cy+R*.1,R*.93);g.add(e)});
    const lip=mesh(new THREE.SphereGeometry(R*.1,10,8),M('#b5535f'));lip.scale.set(1.6,.5,.5);lip.position.set(0,cy-R*.45,R*.95);g.add(lip);
  }
  {const gap=faceTex?1.75:0;
   const cap=mesh(new THREE.SphereGeometry(R*1.06,40,24,Math.PI/2+gap/2,Math.PI*2-gap,0,Math.PI*.56),hairM);cap.scale.set(.97,1.17,1.04);cap.position.set(0,cy,-R*.04);g.add(cap);}
  if(me.hairLen!=='short'){const len=H*(me.hairLen==='long'?.2:.1);
    const back=mesh(new THREE.CylinderGeometry(R*.98,R*(me.hairLen==='long'?.78:.9),len,32,1,true,Math.PI*.42,Math.PI*1.16),M(me.hair,{roughness:.5,side:THREE.DoubleSide}));
    back.position.set(0,cy-len*.38,-R*.12);g.add(back)}

  /* arms */
  const UL=.175*H,FL=.15*H;
  function arm(sd,slv,sm){
    const a=new THREE.Group();a.position.set(sd*(rS+.5*s),Y(L.sh-.01),0);a.rotation.z=sd*14*D;
    a.add(mesh(new THREE.CylinderGeometry(4.3*s,3.5*s,UL,16).translate(0,-UL/2,0),skin));
    const fa=new THREE.Group();fa.position.y=-UL;fa.rotation.z=sd*5*D;
    fa.add(mesh(new THREE.CylinderGeometry(3.5*s,2.7*s,FL,16).translate(0,-FL/2,0),skin));
    const hand=mesh(new THREE.SphereGeometry(3*s,14,10),skin);hand.scale.y=1.45;hand.position.y=-FL-2.2*s;fa.add(hand);
    a.add(fa);
    if(slv&&sm){
      a.add(mesh(new THREE.SphereGeometry(5.1*s,16,10),sm));
      const l1=UL*(slv==='long'?1:.45);
      a.add(mesh(new THREE.CylinderGeometry(4.9*s,slv==='long'?4.1*s:4.6*s,l1,16,1,true).translate(0,-l1/2,0),sm));
      if(slv==='long')fa.add(mesh(new THREE.CylinderGeometry(4.1*s,3.2*s,FL*.96,16,1,true).translate(0,-FL*.48,0),sm));
    }
    return a;
  }
  const strap=(sm,xb,yb,xt,yt)=>{const dx=xt-xb,dy=yt-yb,len=Math.hypot(dx,dy);const m=mesh(new THREE.BoxGeometry(1.7*s,len,.9*s),sm);m.position.set((xb+xt)/2,(yb+yt)/2,0);m.rotation.z=-Math.atan2(dx,dy);return m};
  const straps=(sm,neckline,yb)=>{if(neckline==='strapless')return;const halter=neckline==='halter';[-1,1].forEach(sd=>g.add(strap(sm,sd*rB*.5,Y(yb),sd*(halter?2.5*s:rS*.55),Y(L.sh+.04))))};
  const cloth=(c,o)=>M(c,Object.assign({roughness:.78,bumpMap:fabric,bumpScale:.6,side:THREE.DoubleSide},o||{}));

  let slvType='none',slvMat=null;
  const skirtLathe=(style,yTop,yHem,mat)=>{
    const S=STYLES[style],yS=S.empire?L.bu-.02:L.wa,rS0=S.empire?rB*.93:rW,n=26;const pts=[];
    for(let i=0;i<=n;i++){const f=yTop-(yTop-yHem)*i/n;let r;
      if(S.mode==='fit'){r=f>=L.hi?bodyR(f)+.6:Math.max(rH*.62,rH+.6+(L.hi-f)*H*S.k)}
      else{r=f>=yS?bodyR(f)+.6:Math.max(rS0+.6+(yS-f)*H*S.k,(f>=L.hi?bodyR(f):rH)+.8)}
      pts.push(new THREE.Vector2(r,Y(f)))}
    const m=lathe(pts,mat,S.k>.45?.92:.8);
    if(S.fold){ /* soft drape folds that grow toward the hem */
      const pa=m.geometry.attributes.position,top=Y(yTop),bot=Y(yHem),span=Math.max(1,top-bot);
      for(let i=0;i<pa.count;i++){const x=pa.getX(i),z=pa.getZ(i),y=pa.getY(i);
        if(y>=Y(yS))continue;
        const t=clamp((Y(yS)-y)/Math.max(1,Y(yS)-bot),0,1),a=Math.atan2(z,x),f=1+S.fold*t*Math.sin(a*9+y*.03);
        pa.setXYZ(i,x*f,y,z*f)}
      pa.needsUpdate=true;m.geometry.computeVertexNormals();
    }
    return m;
  };
  if(out.mode==='dress'){
    const d=out.dress,dm=cloth(d.color,{roughness:.55});
    const yTop=d.neckline==='strapless'?L.bu+.03:d.neckline==='v'?L.sh-.035:L.sh-.02;
    g.add(skirtLathe(d.style,yTop,.40-.35*d.length,dm));
    straps(dm,d.neckline,yTop);slvType=d.sleeves;slvMat=dm;
  }else{
    const t=out.top,b=out.bottom,tm=cloth(t.color,{roughness:.85}),bm=cloth(b.color,{roughness:.9});
    const yB=t.type==='longsleeve'?L.hi-.02:L.hi+.02,yT=t.type==='tank'?L.sh-.02:L.sh+.035;
    const pts=[];for(let i=0;i<=16;i++){const f=yB+(yT-yB)*i/16;pts.push(new THREE.Vector2(bodyR(f)+.8,Y(f)))}
    g.add(lathe(pts,tm,.76));
    if(t.type==='tank')straps(tm,'round',L.sh-.02);else{slvType=t.type==='tee'?'short':'long';slvMat=tm}
    if(b.type==='skirt')g.add(skirtLathe('aline',L.wa+.01,.40-.35*b.length,bm));
    else{
      const pp=[];for(let i=0;i<=8;i++){const f=(L.wa+.01)-((L.wa+.01)-L.cr)*i/8;pp.push(new THREE.Vector2(bodyR(f)+.9,Y(f)))}
      g.add(lathe(pp,bm,.76));
      const hemF=b.type==='shorts'?.36:.05;
      [-1,1].forEach(sd=>{const lp=[];for(let f=hemF;f<=L.cr+.03;f+=.02)lp.push(new THREE.Vector2(legR(f)+.9+(b.type==='jeans'?Math.max(0,(.12-f))*8:0),Y(f)));const l=lathe(lp,bm,.9);l.position.x=sd*xL;g.add(l)});
    }
  }
  [-1,1].forEach(sd=>g.add(arm(sd,slvType==='none'?null:slvType,slvMat)));
  /* floor with soft shadow */
  const fl=mesh(new THREE.CircleGeometry(H*.55,64),new THREE.ShadowMaterial({opacity:.28}),true);res.push(fl.material);fl.rotation.x=-Math.PI/2;fl.position.y=-.4;fl.receiveShadow=true;g.add(fl);
  const ring=mesh(new THREE.RingGeometry(H*.26,H*.27,64),M('#8b7fa6',{transparent:true,opacity:.35}),true);ring.rotation.x=-Math.PI/2;ring.position.y=-.2;g.add(ring);
  return{g,res};
}

/* ---------------- fitting from photo ---------------- */
const LMK=[['headTop','Top of head'],['chin','Chin'],['nose','Face centre'],['shL','Shoulder edge'],['shR','Shoulder edge'],['buL','Bust'],['buR','Bust'],['waL','Waist'],['waR','Waist'],['hiL','Hips'],['hiR','Hips'],['cr','Crotch'],['feet','Floor under feet']];
const LMLINES=[['shL','shR'],['buL','buR'],['waL','waR'],['hiL','hiR'],['headTop','chin']];
function defaultLM(){return{headTop:{x:.5,y:.04},chin:{x:.5,y:.16},nose:{x:.5,y:.11},shL:{x:.36,y:.22},shR:{x:.64,y:.22},buL:{x:.38,y:.31},buR:{x:.62,y:.31},waL:{x:.40,y:.40},waR:{x:.60,y:.40},hiL:{x:.37,y:.49},hiR:{x:.63,y:.49},cr:{x:.5,y:.53},feet:{x:.5,y:.96}}}
const ellip=(w,ratio)=>{const a=w/2,b=w*ratio/2;return Math.PI*(3*(a+b)-Math.sqrt((3*a+b)*(a+3*b)))};
function fitLM(){
  if(!LM||!META)return null;
  const L=LM,w=META.w,h=META.h,Hpx=(L.feet.y-L.headTop.y)*h;
  if(!(Hpx>50))return null;
  const cm=ST.me.h/Hpx,wd=(a,b)=>Math.abs(L[b].x-L[a].x)*w*cm;
  const avg=(a,b)=>(L[a].y+L[b].y)/2,F=y=>(L.feet.y-y)/(L.feet.y-L.headTop.y);
  const lm={ch:F(L.chin.y),sh:F(avg('shL','shR')),bu:F(avg('buL','buR')),wa:F(avg('waL','waR')),hi:F(avg('hiL','hiR')),cr:F(L.cr.y)};
  lm.ch=clamp(lm.ch,.83,.9);lm.sh=clamp(lm.sh,.74,lm.ch-.03);lm.bu=clamp(lm.bu,.64,lm.sh-.04);lm.wa=clamp(lm.wa,.54,lm.bu-.04);lm.hi=clamp(lm.hi,.44,lm.wa-.05);lm.cr=clamp(lm.cr,.38,lm.hi-.02);
  const m={sh:clamp(Math.round(wd('shL','shR')),30,52),bust:clamp(Math.round(ellip(wd('buL','buR'),.70)),70,140),waist:clamp(Math.round(ellip(wd('waL','waR'),.68)),55,130),hip:clamp(Math.round(ellip(wd('hiL','hiR'),.72)),80,145)};
  return{lm,m};
}
function applyFit(){
  const r=fitLM();if(!r)return false;
  Object.assign(ST.me,r.m);ST.me.lm=r.lm;ST.me.fitted=true;rebuild();return true;
}
function lmSvgInner(){
  const{w,h,url}=META,r=Math.max(w,h)*.02;
  let s=`<image href="${url}" x="0" y="0" width="${w}" height="${h}"/>`;
  LMLINES.forEach(([a,b])=>{s+=`<line x1="${LM[a].x*w}" y1="${LM[a].y*h}" x2="${LM[b].x*w}" y2="${LM[b].y*h}" stroke="#ff4d8d" stroke-width="${r*.22}" stroke-opacity=".8"/>`});
  LMK.forEach(([k,l])=>{const p=LM[k];s+=`<circle data-lm="${k}" cx="${p.x*w}" cy="${p.y*h}" r="${r}" fill="${k==='nose'?'#22d3c5':k==='feet'?'#ffd23f':'#ff4d8d'}" stroke="#fff" stroke-width="${r*.22}"><title>${l}</title></circle>`});
  return s;
}
function fitReadout(){const r=fitLM();return r?`Fitted from your photo: shoulders ${r.m.sh} cm · bust ${r.m.bust} · waist ${r.m.waist} · hips ${r.m.hip} (estimates from the outline).`:'Place the points, then apply.'}

function faceSource(){return FACE&&FACE.src==='face'&&PH.face[0]?PH.face[0]:PH.body[0]}
function cropFace(c){
  const src=faceSource();if(!src||!FACE)return false;
  const ch=FACE.h*src.h,cw=ch*.8,sx=FACE.cx*src.w-cw/2,sy=FACE.cy*src.h-ch/2,x=c.getContext('2d');
  x.fillStyle='#888';x.fillRect(0,0,240,300);x.drawImage(src.canvas,sx,sy,cw,ch,0,0,240,300);return true;
}
function sampleSkin(c){
  const x=c.getContext('2d'),rs=[],gs=[],bs=[];
  for(const[p,q]of[[.3,.62],[.7,.62],[.5,.74]]){const d=x.getImageData(Math.round(p*240)-6,Math.round(q*300)-6,12,12).data;for(let i=0;i<d.length;i+=4){rs.push(d[i]);gs.push(d[i+1]);bs.push(d[i+2])}}
  const med=a=>a.sort((u,v)=>u-v)[a.length>>1];
  return '#'+[med(rs),med(gs),med(bs)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyFace(){
  const c=document.createElement('canvas');c.width=240;c.height=300;
  if(!cropFace(c))return false;
  ST.me.face=c.toDataURL('image/jpeg',.85);

}

/* ---------------- AI jobs ---------------- */
const lmKeys=LMK.map(k=>k[0]);
const jobs={
  async analyze(){
    const body=PH.body[0],h=ST.me.h;
    const p=`You help a person fit a stylised 3D avatar and give colour advice. The attached photo shows the user themselves (they consented). Image size is ${body.w}×${body.h} px. Return outline landmarks as fractions of the image: x = fraction of width, y = fraction of height, origin top-left.
Landmarks (photo-left = smaller x): headTop (top of hair/head), chin, nose (centre of face), shL/shR (outer edge of each shoulder), buL/buR (outer silhouette at the fullest part of the bust/chest, torso edge not arms), waL/waR (narrowest torso edge at the waist; estimate if arms cover it), hiL/hiR (widest hip edge), cr (crotch, where legs meet), feet (y of the floor/soles; x centre).
If the whole body is not visible, set fullBody false and still give your best estimates. Be neutral and respectful: describe, never judge attractiveness or weight.
Also give colouring advice. Return ONLY JSON:
{"fullBody":true|false,"landmarks":{"headTop":{"x":0,"y":0},"chin":{},"nose":{},"shL":{},"shR":{},"buL":{},"buR":{},"waL":{},"waR":{},"hiL":{},"hiR":{},"cr":{},"feet":{}},"faceBox":{"cx":0-1,"cy":0-1,"h":0-1 (head height from top of hair to chin as fraction of image height)},"hairColor":"#RRGGBB","hairLength":"short|medium|long","undertone":"warm|cool|neutral","build":"slim|average|athletic|curvy|full","bodyShape":"hourglass|pear|apple|rectangle|inverted-triangle|unclear","bestColors":[6 items {"name":"","hex":"#RRGGBB"}],"avoidColors":[3 items {"name":"","hex":"#RRGGBB"}],"tips":[up to 4 short styling tips],"confidence":"low|medium|high"}`;
    const r=await ask(p,[body.blob]);
    const d=defaultLM(),lm={};
    lmKeys.forEach(k=>{const v=(r.landmarks||{})[k]||{};lm[k]={x:num(v.x,0,1,d[k].x),y:num(v.y,0,1,d[k].y)}});
    LM=lm;META={w:body.w,h:body.h,url:body.view};
    const m=ST.me;
    m.hair=hex(r.hairColor,m.hair);m.hairLen=oneOf(r.hairLength,['short','medium','long'],m.hairLen);
    const cl=a=>(Array.isArray(a)?a:[]).map(c=>({name:String(c.name||'').slice(0,24),hex:hex(c.hex,'#888888')}));
    m.profile={undertone:oneOf(r.undertone,['warm','cool','neutral'],'neutral'),build:String(r.build||'').slice(0,20),bodyShape:String(r.bodyShape||'').slice(0,24),bestColors:cl(r.bestColors).slice(0,6),avoidColors:cl(r.avoidColors).slice(0,3),tips:(Array.isArray(r.tips)?r.tips:[]).map(x=>String(x).slice(0,140)).slice(0,4)};
    const fb=r.faceBox||{};
    FACE={src:'body',cx:num(fb.cx,0,1,LM.nose.x),cy:num(fb.cy,0,1,(LM.headTop.y+LM.chin.y)/2),h:clamp(num(fb.h,.03,.35,Math.max(.05,LM.chin.y-LM.headTop.y))*1.15,.04,.3)};
    let msg='Your 3D model now follows your outline. Check the points below and adjust if needed.';
    const fitted=applyFit();
    if(r.fullBody===false)msg='Your whole body was not visible, so proportions are rough. Retake a full-length photo for a better fit.';
    if(PH.face[0]){
      try{
        const f=PH.face[0];
        const q=await ask(`The attached selfie shows the user. Image size ${f.w}×${f.h}. Return ONLY JSON: {"faceBox":{"cx":0-1,"cy":0-1,"h":0-1}} where cx,cy is the centre of the face and h is the head height from top of hair to chin as a fraction of the image height.`,[f.blob]);
        const b=q.faceBox||{};FACE={src:'face',cx:num(b.cx,0,1,.5),cy:num(b.cy,0,1,.45),h:clamp(num(b.h,.1,1,.5)*1.15,.15,1)};
      }catch(e){if(ctl&&ctl.signal.aborted)throw e}
    }
    try{applyFace()}catch(e){}
    if(!fitted)msg='Could not fit the outline. Move the points and press Apply.';
    return{msg};
  },
  async judge(){
    const d=ST.outfit.dress,desc=ST.outfit.mode==='dress'?`a ${STYLES[d.style].n} dress, ${d.neckline} neckline, ${d.sleeves} sleeves, length ${d.length<.2?'mini':d.length<.5?'knee':d.length<.8?'midi':'maxi'}, colour ${d.color}`:`a ${ST.outfit.top.type} in ${ST.outfit.top.color} with ${ST.outfit.bottom.type} in ${ST.outfit.bottom.color}`;
    const r=await ask(`${profText()}\nThe user is considering: ${desc}.\nGive honest, kind styling feedback on how well this suits their colouring and proportions. Never comment on weight negatively; talk about silhouette, proportion and colour.\nReturn ONLY JSON: {"score":0-100,"verdict":"one sentence","pros":["..."],"cons":["..."],"tweaks":{"style":"aline|bodycon|flowy|ball|slip|empire","length":0-1,"neckline":"round|v|strapless|halter","sleeves":"none|short|long","color":"#RRGGBB"} or null}`);
    return{score:Math.round(num(r.score,0,100,60)),verdict:String(r.verdict||''),pros:(r.pros||[]).map(String).slice(0,4),cons:(r.cons||[]).map(String).slice(0,4),tweaks:r.tweaks&&typeof r.tweaks==='object'?r.tweaks:null};

  async rank(){

const PM={

async function ensurePerm(k){
  if(!NATIVE)return true;
  const d=PM[k];let st=await permState(k);
  if(st==='granted'||st==='limited')return true;
  if(st==='denied'){toast('Blocked. Turn it on in Android Settings → Apps → Drape → Permissions.');return false}

const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
function parseJSON(t){t=String(t).replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw{code:'parse'};try{return JSON.parse(t.slice(a,b+1))}catch(e){throw{code:'parse'}}}
async function callClaude(prompt,imgs,signal){
  const c=ST.cfg;
  if(!c.server&&!c.key)throw{code:'no_key'};
  const base=(c.server||'https://api.anthropic.com').replace(/\/+$/,'');
  const content=[];
  for(const b of imgs||[])content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await b64(b)}});
  content.push({type:'text',text:prompt});
  const headers={'content-type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  if(c.key&&!c.server)headers['x-api-key']=c.key;
  if(c.server&&c.token)headers['x-app-token']=c.token;
  let res;
  try{res=await fetch(base+'/v1/messages',{method:'POST',signal,headers,body:JSON.stringify({model:c.model||'claude-sonnet-5-5',max_tokens:4000,messages:[{role:'user',content}]})})}
  catch(e){if(signal&&signal.aborted)throw{code:'aborted'};throw{code:'network'}}
  if(res.status===401||res.status===403)throw{code:'bad_key'};
  if(res.status===429)throw{code:'rate_limited'};
  if(!res.ok)throw{code:'busy'};
  const j=await res.json();
  return parseJSON((j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join(''));
}
function makeKeySample(){const f=()=>{throw{code:'unavailable'}};f.json=(p,o)=>callClaude(p,(o&&o.images)||[],o&&o.signal);f.limits=async()=>({images:true});return f}

async function getPos(){

  if(NATIVE&&G){const r=await G.getCurrentPosition({enableHighAccuracy:false,timeout:15000,maximumAge:600000});return{lat:r.coords.latitude,lon:r.coords.longitude}}
  return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('no geolocation'));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),rej,{timeout:15000,maximumAge:600000})});
}
async function revGeo(lat,lon){
  try{const j=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)).json();return j.city||j.locality||j.principalSubdivision||''}catch(e){return ''}
}
function wxLabel(w){if(w.p>.2||[51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(w.code))return 'Rainy';const t=w.t;return t>=32?'Hot':t>=26?'Warm':t>=18?'Mild':t>=10?'Cool':'Cold'}
function wxText(w){return ({0:'clear',1:'mostly clear',2:'partly cloudy',3:'overcast',45:'fog',48:'fog'})[w.code]||(wxLabel(w)==='Rainy'?'rain':'')}
function locText(){const L=ST.loc;return L.mode!=='off'&&L.wx?` Location: ${L.city||'unknown'}, currently ${L.wx.t}°C${L.wx.max!=null?` (high ${L.wx.max}°C, low ${L.wx.min}°C)`:''}, ${wxText(L.wx)||'dry'}.`:''}
async function refreshWeather(silent){
  const L=ST.loc;if(L.mode==='off')return false;
  try{
    if(L.mode==='gps'){
      if(NATIVE){if(silent){if((await permState('location'))!=='granted')return false}else if(!(await ensurePerm('location')))return false}
      const p=await getPos();L.lat=p.lat;L.lon=p.lon;L.city=(await revGeo(p.lat,p.lon))||'Your location';
    }
    if(L.lat==null||L.lon==null)return false;
    const j=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}&current=temperature_2m,precipitation,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`)).json();
    const c=j.current;if(!c)throw 0;
    L.wx={t:Math.round(c.temperature_2m),p:c.precipitation||0,code:c.weather_code,max:j.daily?Math.round(j.daily.temperature_2m_max[0]):null,min:j.daily?Math.round(j.daily.temperature_2m_min[0]):null,ts:Date.now()};
    ST.dsel.wea=wxLabel(L.wx);save();
    if(!silent)toast(`${L.city||'Weather'}: ${L.wx.t}°C, ${wxLabel(L.wx)}`);
    if(tab==='daily'||tab==='settings')renderPanel();
    return true;
  }catch(e){if(!silent)toast('Could not get the weather. Check your connection.');return false}
}

  try{
    if(NATIVE){const w=await P('Filesystem').writeFile({path:name,data,directory:'CACHE',encoding:'utf8'});await P('Share').share({title:'Drape backup',url:w.uri,dialogTitle:'Save your Drape backup'});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast('Backup cancelled')}
}

/* ---- settings tab ---- */
function permLabel(s){return s==='granted'||s==='limited'?'Allowed':s==='denied'?'Blocked. Turn it on in Android Settings → Apps → Drape → Permissions.':s==='unsupported'?'Managed by your browser here':'Not asked yet'}
function permRow(k,label,desc){
  const s=PERM[k]||'prompt',on=s==='granted'||s==='limited';
  return `<div class="pc"><div style="flex:1;min-width:0"><b>${label}</b><div class="mut sm">${esc(desc)}</div><div class="sm ${on?'':'mut'}">${esc(permLabel(s))}</div></div>${on?'<span class="chip">✓</span>':(s==='denied'||s==='unsupported')?'':`<button class="btn s p" data-a="perm" data-k="${k}">Allow</button>`}</div>`;
}
function tSettings(){
  const L=ST.loc,c=ST.cfg;
  let h=`<div class="card"><h3>Permissions</h3><p class="mut sm">Drape asks only when you use a feature. You can change any of these later in Android Settings.</p>
  ${permRow('camera','📷 Camera','Take body, face and closet photos')}${permRow('photos','🖼️ Photos &amp; gallery','Choose pictures with the Android photo picker')}${permRow('location','📍 Location','Local weather for outfit ideas')}${permRow('notif','🔔 Notifications','Your daily look reminder')}</div>
  <div class="card"><h3>Location &amp; weather</h3>
  <p class="mut sm">Used only to fetch today's weather (from Open-Meteo) so outfit ideas match the day. Nothing is stored on a server.</p>
  <div class="chips" style="margin-bottom:10px">${[['off','Off'],['gps','Use my location'],['city','Pick a city']].map(([v,l])=>`<button class="chip" data-a="locMode" data-v="${v}" aria-pressed="${L.mode===v}">${l}</button>`).join('')}</div>
  ${L.mode==='city'?`<div class="row"><input type="text" id="citySearch" placeholder="Search a city, e.g. Udupi" value="" aria-label="City"><button class="btn s p" data-a="locSearch">Search</button></div>
   ${(RES.geo||[]).map((r,i)=>`<div class="pc"><div style="flex:1">${esc(r.city)}</div><button class="btn s" data-a="locPick" data-i="${i}">Use</button></div>`).join('')}
   ${RES.geo&&!RES.geo.length?'<p class="mut sm">No matches.</p>':''}`:''}
  ${L.mode!=='off'?`<p class="sm" style="margin-top:8px">📍 ${esc(L.city||'No place chosen yet')}${L.wx?` · ${L.wx.t}°C, ${esc(wxText(L.wx))} → ${esc(ST.dsel.wea)}`:''}</p><button class="btn s" data-a="locRefresh">Refresh weather</button>`:''}</div>
  <div class="card"><h3>Daily look reminder</h3>
  ${NATIVE?`<div class="row"><label class="row" style="gap:8px"><input type="checkbox" data-a="remToggle" ${ST.rem.on?'checked':''}> Remind me every day at</label><input type="time" data-rem="time" value="${esc(ST.rem.time)}" aria-label="Reminder time"></div>`:'<p class="mut sm">Reminders are available in the Android app.</p>'}</div>`;
  if(ENGINE==='key')h+=`<div class="card"><h3>AI connection</h3>
  <p class="mut sm">Photo reading and style advice use Claude. Paste your own API key (from console.anthropic.com). It stays on this phone, is never included in backups, and usage is billed to your Anthropic account.</p>
  <div class="fld"><label for="cfgKey">Claude API key<span></span></label><input type="password" id="cfgKey" data-cfg="key" autocomplete="off" placeholder="sk-ant-…" value="${esc(c.key)}" style="width:100%"></div>
  <div class="fld"><label for="cfgModel">Model<span></span></label><select id="cfgModel" data-cfg="model">${[['claude-sonnet-5-5','Sonnet 5.5 (balanced)'],['claude-haiku-5-5','Haiku 5.5 (cheaper, faster)'],['claude-opus-5-5','Opus 5.5 (most capable)']].map(([v,l])=>`<option value="${v}" ${c.model===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <details><summary>Use my own server instead (advanced)</summary><div class="fld"><label for="cfgServer">Server URL<span></span></label><input type="text" id="cfgServer" data-cfg="server" placeholder="https://your-proxy.example.workers.dev" value="${esc(c.server)}" style="width:100%"></div>
  <div class="fld"><label for="cfgToken">Access token<span></span></label><input type="password" id="cfgToken" data-cfg="token" value="${esc(c.token||'')}" style="width:100%"></div></details>
  <div class="row" style="margin-top:8px"><button class="btn p s" data-a="testAI" ${BUSY?'disabled':''}>Test connection</button></div>${RES.test?`<p class="${RES.test.ok?'':'err'} sm">${esc(RES.test.msg)}</p>`:''}</div>`;
  h+=`<div class="card"><h3>About &amp; help</h3><p class="mut sm">Photos are sent to the AI service only when you tap Analyze or Scan. They are not saved: only measurements, a small face crop, your closet list and looks are stored, on this device.</p>
  <div class="row"><a class="btn s" href="mailto:${esc(SUPPORT_EMAIL)}?subject=Drape%20AI%20output%20problem">Report a problem with AI results</a></div></div>`;
  return h;
}

/* ---- events for the mobile layer ---- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,d=b.dataset,L=ST.loc;
  if(a==='tab'&&d.t==='settings'){refreshPerms();return}
  if(a==='nativePick'){nativePick(d.k,d.s);return}
  if(a==='perm'){await ensurePerm(d.k);renderPanel();return}
  if(a==='locMode'){
    L.mode=d.v;RES.geo=null;if(d.v==='off'){L.wx=null}save();renderPanel();
    if(d.v==='gps')refreshWeather(false);return}
  if(a==='locSearch'){const q=($('citySearch')||{}).value||'';if(q.trim().length<2)return;const r=await geoSearch(q.trim());if(r===null)toast('Search failed. Check your connection.');else RES.geo=r;renderPanel();return}
  if(a==='locPick'){const r=(RES.geo||[])[+d.i];if(!r)return;L.city=r.city;L.lat=r.lat;L.lon=r.lon;RES.geo=null;save();await refreshWeather(false);renderPanel();return}
  if(a==='locRefresh'){await refreshWeather(false);return}
  if(a==='testAI'){
    BUSY='test';renderPanel();
    try{const r=await callClaude('Reply with only this JSON: {"ok":true}',[]);RES.test={ok:!!r.ok,msg:'Connected. Claude replied.'}}catch(x){RES.test={ok:false,msg:errMsg(x)}}
    BUSY=null;renderPanel();return}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.cfg){ST.cfg[t.dataset.cfg]=String(t.value||'').trim();save();renderAll();return}
  if(t.dataset.a==='remToggle'){ST.rem.on=t.checked;await setReminder();save();renderPanel();return}
  if(t.dataset.rem==='time'){ST.rem.time=t.value||'08:00';save();if(ST.rem.on)setReminder();return}
});
async function initPlatform(){
  if(NATIVE)refreshPerms();
  const L=ST.loc;
  if(L.mode!=='off'&&(!L.wx||Date.now()-L.wx.ts>3600e3))refreshWeather(true);
  if(NATIVE&&ST.rem.on)setReminder();
}

initGL();loadFace();renderAll();initAI();initStore();initPlatform();
</script>
</body>
